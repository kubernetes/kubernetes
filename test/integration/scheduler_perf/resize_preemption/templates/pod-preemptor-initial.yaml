apiVersion: v1
kind: Pod
metadata:
  name: pod-preemptor-{{ .Index }}
spec:
  nodeName: node-{{ .Index }}
  priority: 1000
  terminationGracePeriodSeconds: 0
  containers:
  - image: registry.k8s.io/pause:3.10.1
    name: pause
    ports:
    - containerPort: 80
    resources:
      limits:
        cpu: 200m
        memory: 500Mi
      requests:
        cpu: 200m
        memory: 500Mi
