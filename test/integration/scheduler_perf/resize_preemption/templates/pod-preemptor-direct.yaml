apiVersion: v1
kind: Pod
metadata:
  generateName: pod-resize-preemptor-
spec:
  priority: 1000
  terminationGracePeriodSeconds: 0
  containers:
  - image: registry.k8s.io/pause:3.10.1
    name: pause
    ports:
    - containerPort: 80
    resources:
      limits:
        cpu: 3000m
        memory: 500Mi
      requests:
        cpu: 3000m
        memory: 500Mi
