apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: test-claim-template
spec:
  spec:
    devices:
      requests:
      - name: cpus
        exactly:
          deviceClassName: test-class
          count: 2
          selectors:
          - cel:
              expression: device.attributes["test-driver.cdi.k8s.io"].type == "cpu"
      - name: nics
        exactly:
          deviceClassName: test-class
          count: 2
          selectors:
          - cel:
              expression: device.attributes["test-driver.cdi.k8s.io"].type == "nic"
      constraints:
      - requests: [cpus, nics]
        matchAttribute: resource.kubernetes.io/pcieRoot
