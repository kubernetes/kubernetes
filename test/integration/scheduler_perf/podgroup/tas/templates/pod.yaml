apiVersion: v1
kind: Pod
metadata:
  name: test-tas-scheduling-{{.Index}}
spec:
  schedulingGroup:
    podGroupName: group-{{DivideInt .Index .podsPerGroup}}
  containers:
  - image: registry.k8s.io/pause:3.10.1
    name: pause
    resources:
      requests:
        cpu: {{if .cpuRequest}}{{.cpuRequest}}{{else}}100m{{end}}
        memory: 100Mi
