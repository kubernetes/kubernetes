      initNodes: 5000
      initRootCPG: 2
      initPodGroups: 8
      podGroupsPerCompositePodGroup: 4
      minCount: 750
      podsPerGroup: 750
  - name: 5000Nodes_2Trees_2Level_8PodGroups_8000Pods
    labels: [performance]
    params:
      initNodes: 5000
      initRootCPG: 2
      initPodGroups: 8
      podGroupsPerCompositePodGroup: 4
      minCount: 1000
      podsPerGroup: 1000
  - name: 5000Nodes_2Trees_2Level_64PodGroups_6400Pods
    labels: [performance]
    params:
      initNodes: 5000
      initRootCPG: 2
      initPodGroups: 64
      podGroupsPerCompositePodGroup: 32
      minCount: 100
      podsPerGroup: 100
  - name: 5000Nodes_2Trees_2Level_128PodGroups_12800Pods
    labels: [performance]
    params:
      initNodes: 5000
      initRootCPG: 2
      initPodGroups: 128
      podGroupsPerCompositePodGroup: 64
      minCount: 100
