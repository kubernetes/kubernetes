  - name: 5000Nodes_4Trees_2Level_16PodGroups_12000Pods
    labels: [performance]
    params:
      initNodes: 5000
      initRootCPG: 4
      initPodGroups: 16
      podGroupsPerCompositePodGroup: 4
      minCount: 750
      podsPerGroup: 750
  - name: 5000Nodes_4Trees_2Level_16PodGroups_16000Pods
    labels: [performance]
    params:
      initNodes: 5000
