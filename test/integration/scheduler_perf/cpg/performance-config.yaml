# The following labels are used in this file:
#
# - integration-test: test cases to run as the integration test.
# - performance: test cases to run in the performance test.
# - short: supplemental label for the above two labels (must not used alone), which literally means short execution time test cases.

# 2LevelCompositePodGroupsBasicScheduling benchmarks scheduling throughput when both CompositePodGroup
# and its children PodGroups use basic scheduling policy, allowing pods and groups to be scheduled independently without quorum.
- name: 2LevelCompositePodGroupsBasicScheduling
  featureGates:
    GenericWorkload: true
    TopologyAwareWorkloadScheduling: true
    CompositePodGroup: true
  workloadTemplate:
  - opcode: createNodes
    countParam: $initNodes
  - opcode: createNamespaces
    prefix: cpg-basic-ns
    count: 1
  - opcode: createCompositePodGroups
    # Level 1 represents the root composite podgroup.
    rootCountParam: $initRootCompositePodGroups
    depth: 2
    childrenPodGroupsPerCPGParam: $childrenPodGroupsPerCPG
    namespace: cpg-basic-ns-0
    templatePath: templates/composite-podgroup.yaml
  - opcode: createPodGroups
    # Level 2 represents leaf podgroups children of the root composite podgroup.
    countParam: $initPodGroups
    namespace: cpg-basic-ns-0
    templatePath: templates/podgroup.yaml
    templateParams:
      parentLevel: 1
      childrenPodGroupsPerCPG: $childrenPodGroupsPerCPG
  - opcode: createPods
    # Create pods belonging to child pod groups according to their indices.
    countParam: $initPodGroups
    countMultiplierParam: $podsPerGroup
    namespace: cpg-basic-ns-0
    podTemplatePath: templates/pod.yaml
    collectMetrics: true
    templateParams:
      podsPerGroup: $podsPerGroup
  workloads:
  - name: 10Nodes_2Trees_2Level_4PodGroups_12Pods
    labels: [integration-test, short]
    params:
      initNodes: 10
      initRootCompositePodGroups: 2
      initPodGroups: 4
      childrenPodGroupsPerCPG: 2
      podsPerGroup: 3
  - name: 100Nodes_4Trees_2Level_8PodGroups_24Pods
    labels: [integration-test]
    params:
      initNodes: 100
      initRootCompositePodGroups: 4
      initPodGroups: 8
      childrenPodGroupsPerCPG: 2
      podsPerGroup: 3
  - name: 5000Nodes_4Trees_2Level_16PodGroups_8000Pods
    labels: [performance]
    params:
      initNodes: 5000
      initRootCompositePodGroups: 4
      initPodGroups: 16
      childrenPodGroupsPerCPG: 4
      podsPerGroup: 500
  - name: 5000Nodes_4Trees_2Level_16PodGroups_12000Pods
    labels: [performance]
    params:
      initNodes: 5000
      initRootCompositePodGroups: 4
      initPodGroups: 16
      childrenPodGroupsPerCPG: 4
      podsPerGroup: 750
  - name: 5000Nodes_4Trees_2Level_16PodGroups_16000Pods
    labels: [performance]
    params:
      initNodes: 5000
      initRootCompositePodGroups: 4
      initPodGroups: 16
      childrenPodGroupsPerCPG: 4
      podsPerGroup: 1000
  - name: 5000Nodes_2Trees_2Level_64PodGroups_6400Pods
    labels: [performance]
    params:
      initNodes: 5000
      initRootCompositePodGroups: 2
      initPodGroups: 64
      childrenPodGroupsPerCPG: 32
      podsPerGroup: 100
  - name: 5000Nodes_2Trees_2Level_128PodGroups_12800Pods
    labels: [performance]
    params:
      initNodes: 5000
      initRootCompositePodGroups: 2
      initPodGroups: 128
      childrenPodGroupsPerCPG: 64
      podsPerGroup: 100
  - name: 5000Nodes_2Trees_2Level_256PodGroups_25600Pods
    labels: [performance]
    params:
      initNodes: 5000
      initRootCompositePodGroups: 2
      initPodGroups: 256
      childrenPodGroupsPerCPG: 128
      podsPerGroup: 100

# 2LevelCompositePodGroupsGangScheduling benchmarks all-or-nothing scheduling throughput of CompositePodGroups
# where both the CompositePodGroups (minGroupCount) and children PodGroups (minCount) enforce gang quorum.
- name: 2LevelCompositePodGroupsGangScheduling
