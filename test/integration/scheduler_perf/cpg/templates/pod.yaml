apiVersion: v1
kind: Pod
metadata:
  name: pod-{{.Index}}
spec:
  {{- with .priority }}
  priority: {{ . }}
  {{- end }}
  schedulingGroup:
    podGroupName: pg-{{DivideInt .Index .podsPerGroup}}
  terminationGracePeriodSeconds: 0
  containers:
  - image: registry.k8s.io/pause:3.10.1
    name: pause
    resources:
      requests:
        cpu: {{ or .cpuRequest "100m" }}
        memory: 100Mi
