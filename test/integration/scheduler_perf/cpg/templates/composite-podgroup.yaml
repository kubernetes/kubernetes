apiVersion: scheduling.k8s.io/v1alpha3
kind: CompositePodGroup
metadata:
  name: cpg-l{{.Level}}-{{.Index}}
spec:
  {{- if gt .Level 1 }}
  parentCompositePodGroupName: cpg-l{{.ParentLevel}}-{{.ParentIndex}}
  {{- end }}
  workloadRef:
    workloadName: cpg-workload
    templateName: cpg-template
  {{- with .priority }}
  priority: {{ . }}
  {{- end }}
  schedulingPolicy:
  {{- if .gang }}
    gang:
      minGroupCount: {{.ChildrenCount}}
  {{- else }}
    basic: {}
  {{- end }}
  {{- with .topologyKey }}
  schedulingConstraints:
    topology:
    - key: {{ . }}
  {{- end }}
