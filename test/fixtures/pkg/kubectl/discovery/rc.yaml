apiVersion: v1
kind: ReplicationController
metadata:
  name: discovery-fixture
spec:
  replicas: 2
  # Selector is inferred from the pod template labels when omitted.
  template:
    metadata:
      labels:
        app: discovery-fixture
    spec:
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.66.1
        args:
        - pause
