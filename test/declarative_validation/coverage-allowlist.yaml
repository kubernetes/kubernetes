# Suppressions for declarative-validation coverage.
#
# Every field is required, empty is rejected at load time so an entry can never silently overexclude.
#   - apiVersion matches by literal equality (in the "<group>/<version>" form, or just "<version>" for core or wildcard equality with "*/*")
#   - path matches by literal equality or wildcard with "*" or glob prefix with "*..."
#   - kind/errorType/origin match literally or wildcard with "*" or glob prefix with "*..."
#
# Example:
#   - apiVersion: autoscaling/v1   # one specific rule
#     kind: Scale
#     path: spec.replicas
#     errorType: FieldValueInvalid
#     origin: minimum
#     reason: tested separately
#
# Run hack/update-codegen.sh after editing.

- apiVersion: extensions/v1beta1
  kind: '*'
  path: '*'
  errorType: '*'
  origin: '*'
  reason: Not served by kube-apiserver.

- apiVersion: v1
  kind: Pod
  path: spec.volumes[*].ephemeral.volumeClaimTemplate
  errorType: FieldValueRequired
  origin: '*'
  reason: Nested in a Pod volume list without update correlation.

- apiVersion: v1
  kind: Pod
  path: spec.volumes[*].ephemeral.volumeClaimTemplate.spec.volumeName
  errorType: FieldValueInvalid
  origin: update
  reason: Nested in a Pod volume list without update correlation.

