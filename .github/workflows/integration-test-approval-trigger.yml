# Integration Test Approval Trigger — Stage 1 of 2
#
# This workflow fires when a PR review is approved and simply completes, signaling
# the privileged Stage 2 workflow (integration-test-approval-deployment.yml)
# via the workflow_run event.
#
# We need a two-stage workflow for integration test deployment on approval
# because for fork PRs, pull_request_review has no privilege and cannot deploy
# integration tests that require repo-level secrets and access to the CodeBuild
# runner. By completing here, we trigger a workflow_run event which runs Stage 2
# on the base branch (main) with full access to both.
#
# This workflow can be triggered by a review from anyone, including community
# contributors. Therefore, the review event itself is untrusted, and the
# second-stage workflow validates the reviewer's identity and approval before
# proceeding. Artifacts generated by this workflow should never be trusted
# by Stage 2.

name: Integration Test Approval Trigger

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    if: github.event.review.state == 'approved'
    steps:
      - name: Signal complete
        run: echo "Approved review submitted. Signaling Integration Test Approval Deployment."
