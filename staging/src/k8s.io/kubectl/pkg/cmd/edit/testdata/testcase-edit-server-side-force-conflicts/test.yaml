# kubectl edit service dns --namespace=edit-test --server-side --force-conflicts
description: resolve a server-side edit conflict using force-conflicts
mode: edit
args:
- service
- dns
serverSide: "true"
forceConflicts: "true"
namespace: edit-test
expectedStdout:
- service/dns edited
expectedExitCode: 0
steps:
- type: request
  expectedMethod: GET
  expectedPath: /api/v1/namespaces/edit-test/services/dns
  expectedInput: 0.request
  resultingStatusCode: 200
  resultingOutput: 0.response
- type: edit
  expectedInput: 1.original
  resultingOutput: 1.edited
- type: request
  expectedMethod: PATCH
  expectedPath: /api/v1/namespaces/edit-test/services/dns
  expectedContentType: application/apply-patch+yaml
  expectedQuery:
    fieldManager: kubectl-edit
    force: "true"
  expectedInput: 2.request
  resultingStatusCode: 200
  resultingOutput: 2.response
