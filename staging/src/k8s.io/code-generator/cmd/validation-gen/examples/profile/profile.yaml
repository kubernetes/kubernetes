# An example of the profile a project adds to the built-in one, read by
# the stock validation-gen via --profile. See README.md.
formats:
  # The generator compiles the regex into the generated package and passes the
  # message and origin from here, so the errors are attributable.
  - name: example-uri
    docs: This field holds an absolute URI, with a scheme.
    regex: ^[a-z][a-z0-9+.-]*://[^\s]+$
    message: must be an absolute URI with a scheme (e.g. 'https://example.com/path')

  - name: example-hex-digest
    docs: This field holds a lower-case hexadecimal digest.
    regex: ^[0-9a-f]{8,}$
    message: must be a lower-case hexadecimal digest of at least 8 characters
