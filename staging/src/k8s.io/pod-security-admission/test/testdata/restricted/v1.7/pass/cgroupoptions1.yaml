apiVersion: v1
kind: Pod
metadata:
  name: cgroupoptions1
spec:
  containers:
  - image: registry.k8s.io/pause
    name: container1
    securityContext:
      cgroupOptions:
        mountMode: ReadOnly
  initContainers:
  - image: registry.k8s.io/pause
    name: initcontainer1
    securityContext:
      cgroupOptions:
        mountMode: ReadOnly
  securityContext:
    runAsNonRoot: true
